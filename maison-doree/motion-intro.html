<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Dorée — Motion Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FAF5EC; --ink:#2B1D12; --terracotta:#B85C38; --sage:#7D8C6F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:var(--cream); overflow:hidden; font-family:'Inter',sans-serif; }

  .intro { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; position:relative; }

  .glow { position:absolute; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(184,92,56,.16), transparent 65%); top:50%; left:50%; transform:translate(-50%,-50%); animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ transform:translate(-50%,-50%) scale(1);} 50%{ transform:translate(-50%,-50%) scale(1.12);} }

  .particle { position:absolute; border-radius:50%; background:var(--terracotta); opacity:.18; animation: float 7s ease-in-out infinite; }
  .particle.p1 { width:26px; height:26px; top:16%; left:12%; }
  .particle.p2 { width:14px; height:14px; top:24%; right:14%; background:var(--sage); animation-delay:-2s; }
  .particle.p3 { width:9px; height:9px; bottom:22%; left:18%; animation-delay:-4s; }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-34px);} }

  .dough {
    width:170px; height:170px; z-index:2;
    border-radius: 50% 47% 52% 48% / 55% 48% 52% 45%;
    background: var(--sage);
    border: 3px solid var(--ink);
    box-shadow: 0 0 90px rgba(184,92,56,.35);
    animation: rise 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: .2s;
  }
  @keyframes rise { from { transform: scale(0.15); border-radius: 50%; } to { transform: scale(1); border-radius: 50% 47% 52% 48% / 55% 48% 52% 45%; } }

  .line { overflow:hidden; }
  .line span {
    display:block;
    font-family:'Fraunces',serif; font-weight:400;
    font-size: clamp(52px, 9vw, 108px);
    letter-spacing:-2px; line-height:1.02;
    animation: riseUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .line.one span { color: var(--ink); animation-delay: .5s; }
  .line.two span { color: var(--terracotta); font-style: italic; animation-delay: 1s; }

  @keyframes riseUp { from { transform: translateY(115%); } to { transform: translateY(0); } }

  .sub {
    font-family:'Caveat',cursive; font-size:34px; color: var(--terracotta);
    transform: rotate(-3deg);
    animation: fadeIn 1s ease .9s backwards;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(14px) rotate(-3deg);} to { opacity:1; transform: translateY(0) rotate(-3deg);} }

  .tagline {
    position:absolute; bottom:42px; left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:4px; text-transform:uppercase; color:#7a6a58;
    animation: fadeIn 1s ease 2.2s backwards;
  }

  .fade-out { animation: fadeOut 1.2s ease 14.5s forwards; }
  @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

  #ctl {
    position:fixed; bottom:26px; right:26px; z-index:10;
    background:var(--ink); color:var(--cream); border:none; cursor:pointer;
    padding:13px 24px; border-radius:100px; font-size:12px; letter-spacing:2px; text-transform:uppercase;
    font-family:'Inter',sans-serif;
  }

  @media (prefers-reduced-motion: reduce) {
    .dough, .line span, .sub, .tagline, .glow, .particle { animation: none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <div class="glow"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>

  <div class="intro fade-out">
    <div class="dough"></div>
    <div class="line one"><span>Maison</span></div>
    <div class="line two"><span>Dorée</span></div>
    <div class="sub">La douceur commence ici</div>
    <div class="tagline">Fait maison • Depuis 1987</div>
  </div>

  <button id="ctl">▶ Musique & Voix</button>

<script>
  // ---------- MUSIQUE (Web Audio API - synthèse douce) ----------
  let audioCtx = null;
  function startMusic() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);

    const bpm = 80, beat = 60 / bpm;
    const melody = [523.25,659.25,783.99,659.25, 523.25,392.0,329.63,392.0, 493.0,587.33,698.46,587.33, 440.0,523.25,587.33,523.25];

    let t = ctx.currentTime + 0.15;
    melody.forEach((f) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.85);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + beat * 0.9);
      t += beat * 0.92;
    });
  }

  // ---------- VOIX OFF (Web Speech API) ----------
  function speak() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("La douceur commence ici.");
    u.lang = 'fr-FR';
    u.rate = 0.92;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('ctl').onclick = () => { startMusic(); speak(); };
</script>
</body>
</html>
